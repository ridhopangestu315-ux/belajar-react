name: Deploy StudyFlow to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v6

      - name: Siapkan Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v6

      - name: Pasang dependency
        run: npm ci

      - name: Build aplikasi
        run: npm run build

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
